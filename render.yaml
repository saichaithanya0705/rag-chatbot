services:
  - type: web
    name: rag-chatbot-backend
    runtime: docker
    plan: starter
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    healthCheckPath: /api/system/ready
    disk:
      name: rag-chatbot-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: RAG_NVIDIA_API_KEY
        sync: false
      - key: RAG_ALLOWED_ORIGINS
        sync: false
      - key: RAG_NVIDIA_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: RAG_NVIDIA_CHAT_MODEL
        value: meta/llama-3.2-11b-vision-instruct
      - key: RAG_RERANKER_MODEL
        value: nvidia/nv-rerankqa-mistral-4b-v3
      - key: RAG_EMBED_MODEL
        value: nvidia/llama-nemotron-embed-1b-v2
      - key: RAG_EMBEDDING_DIMENSIONS
        value: "1024"
